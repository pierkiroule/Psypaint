<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>psypaint360 — Squiggle Organique</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--hs:min(84vw,60vh,460px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#17130f;color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;touch-action:none;user-select:none}
#app{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#3a332b,#17130f 75%)}
.glass{background:rgba(30,25,20,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,240,215,.16);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.gb{background:rgba(255,240,215,.07);border:1px solid rgba(255,240,215,.16);color:#fff;cursor:pointer;transition:.25s}
.gb:hover{background:rgba(255,240,215,.18)}.gb:active{transform:scale(.92)}
#brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;right:0;text-align:center;pointer-events:none;z-index:30;transition:opacity .6s}
#brand h1{margin:0;font-weight:800;font-size:14px;letter-spacing:.38em}
#brand p{margin:3px 0 0;font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.5}
#hublot{position:absolute;left:50%;top:46%;width:var(--hs);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;z-index:5;
box-shadow:0 0 0 1px rgba(0,0,0,.25),0 22px 70px rgba(0,0,0,.55),inset 0 0 50px rgba(120,90,50,.3);transition:transform .9s cubic-bezier(.16,1,.3,1),opacity .7s}
#hublot::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 32% 24%,rgba(255,250,235,.22),transparent 45%),radial-gradient(circle,transparent 66%,rgba(90,60,30,.28))}
#c2d{width:100%;height:100%;display:block}
#three{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .9s;z-index:4}
#three canvas{display:block;width:100%;height:100%}
#ring{position:absolute;left:50%;top:46%;width:min(98vw,74vh,570px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:20;transition:opacity .5s}
.bb{position:absolute;width:52px;height:52px;border-radius:50%;font-size:22px;display:grid;place-items:center;pointer-events:auto;transform:translate(-50%,-50%);opacity:.55}
.bb[data-a="true"]{opacity:1;background:rgba(255,240,215,.25);border-color:rgba(255,240,215,.8);box-shadow:0 0 22px rgba(255,220,170,.4);transform:translate(-50%,-50%) scale(1.14)}
#b-wash{left:50%;top:2%}#b-ink{left:93%;top:38%}#b-pencil{left:77%;top:92%}#b-bloom{left:23%;top:92%}#b-leaf{left:7%;top:38%}
#meter{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);width:140px;height:3px;transform:translateX(-50%);background:rgba(255,240,215,.1);border-radius:9px;overflow:hidden;z-index:30}
#fill{height:100%;width:0;background:linear-gradient(90deg,#5f8f5a,#d6a23c,#c4647a)}
#pal{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);transform:translateX(-50%);display:flex;gap:8px;padding:6px 8px;border-radius:99px;z-index:30;transition:opacity .5s}
.pb{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.pb.on{border-color:#fff}
#bar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:99px;z-index:30}
#bar button{height:44px;min-width:44px;border-radius:99px;font-size:16px;padding:0 12px}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%) translateY(-8px);padding:6px 16px;border-radius:20px;font-size:12px;letter-spacing:.05em;opacity:0;pointer-events:none;transition:.3s;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);left:0;right:0;text-align:center;font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.35;pointer-events:none}
body.im #hublot{transform:translate(-50%,-50%) scale(2.6);opacity:0;pointer-events:none}
body.im #three{opacity:1;pointer-events:auto}
body.im #ring,body.im #pal,body.im #brand{opacity:0;pointer-events:none}
body.im #imb{background:rgba(255,240,215,.3)}
</style>
</head>
<body>
<div id="app">
 <div id="brand"><h1>PSYPAINT360</h1><p>Squiggle organique · aquarelle, encre &amp; crayon</p></div>
 <div id="toast" class="glass"></div>
 <div id="three"></div>
 <div id="hublot"><canvas id="c2d"></canvas></div>
 <div id="ring">
  <button class="bb gb" id="b-wash" data-b="wash" data-a="true" title="Lavis">💧</button>
  <button class="bb gb" id="b-ink" data-b="ink" data-a="false" title="Encre">🖋️</button>
  <button class="bb gb" id="b-pencil" data-b="pencil" data-a="false" title="Crayon de couleur">🖍️</button>
  <button class="bb gb" id="b-bloom" data-b="bloom" data-a="false" title="Floraison">🌸</button>
  <button class="bb gb" id="b-leaf" data-b="leaf" data-a="false" title="Feuillage">🍃</button>
 </div>
 <div id="meter"><div id="fill"></div></div>
 <div id="pal" class="glass">
  <button class="pb on" data-p="jardin" style="background:linear-gradient(135deg,#5f8f5a,#d6a23c)"></button>
  <button class="pb" data-p="mer" style="background:linear-gradient(135deg,#2f5f9e,#4da3a5)"></button>
  <button class="pb" data-p="automne" style="background:linear-gradient(135deg,#c8742b,#a63d2f)"></button>
  <button class="pb" data-p="encre" style="background:linear-gradient(135deg,#14161a,#a8957b)"></button>
 </div>
 <div id="bar" class="glass">
  <button id="src" class="gb" title="Source audio">🎹</button>
  <button id="play" class="gb">Ⅱ</button>
  <button id="imb" class="gb" style="font-size:12px;font-weight:600;letter-spacing:.1em">🌿 3D</button>
  <button id="snap" class="gb">📸</button>
  <button id="undo" class="gb">↩️</button>
  <button id="clear" class="gb" style="color:#f0907a">✕</button>
 </div>
 <input id="file" type="file" accept="audio/*" style="display:none">
 <div id="hint">Dessiner · Écouter · Double-toucher = immersion</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const hublot=$('#hublot'),cv=$('#c2d'),ctx=cv.getContext('2d'),toastEl=$('#toast');
const PAL={
 jardin:{c:['#5f8f5a','#d6a23c','#c4647a'],ink:'#2b3328',bg:'#f2ebd9',bg2:'#e2d6bb'},
 mer:{c:['#2f5f9e','#4da3a5','#9a7a52'],ink:'#1b2736',bg:'#eff0e7',bg2:'#d9ddcf'},
 automne:{c:['#c8742b','#a63d2f','#d9aa48'],ink:'#3a2318',bg:'#f4e8d1',bg2:'#e4d0aa'},
 encre:{c:['#4a4f58','#8b929c','#a8957b'],ink:'#14161a',bg:'#efede6',bg2:'#dbd7ca'}};
let pal='jardin',brush='wash',strokes=[],cur=null,im=false;
let B=0,M=0,Hh=0,E=0;
const h=(n,s)=>{const x=Math.sin(n*127.1+s*311.7)*43758.5453;return x-Math.floor(x)};
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('show'),2000)}

/* ================= AUDIO ================= */
let ac,an,fd,out,mode='synth',synth=null,synthOn=false,el,ms,src;
const PENT=[220,261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99];
function initAudio(){
 if(ac)return;
 ac=new (window.AudioContext||window.webkitAudioContext)();
 an=ac.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.8;fd=new Uint8Array(an.frequencyBinCount);
 out=ac.createGain();an.connect(out);out.connect(ac.destination);
}
function setupSynth(){
 if(synth)return;
 const g=ac.createGain();g.gain.value=0;
 const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=600;f.Q.value=2;
 const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.13;lg.gain.value=320;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
 [[110,'sine',0],[164.81,'triangle',4],[220.5,'sine',-5],[261.63,'sine',3],[329.63,'sine',-3]].forEach(([fr,ty,dt],i)=>{
  const o=ac.createOscillator(),og=ac.createGain();o.type=ty;o.frequency.value=fr;o.detune.value=dt;og.gain.value=i>2?.18:.5;o.connect(og);og.connect(f);o.start()});
 const lead=ac.createOscillator(),lgn=ac.createGain();lead.type='triangle';lead.frequency.value=440;lgn.gain.value=0;lead.connect(lgn);lead.start();
 const d=ac.createDelay(1.5),fb=ac.createGain(),wet=ac.createGain();d.delayTime.value=.42;fb.gain.value=.45;wet.gain.value=.5;
 f.connect(g);lgn.connect(g);g.connect(an);g.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(an);
 synth={g,f,lead,lgn};
}
function setSynth(on){synthOn=on;if(!synth)return;synth.g.gain.setTargetAtTime(on?.2:0,ac.currentTime,.3);$('#play').textContent=on?'Ⅱ':'▶'}
function lead(nx,ny){
 if(!synth||!synthOn)return;
 synth.lead.frequency.setTargetAtTime(PENT[Math.min(9,Math.floor(nx*10))],ac.currentTime,.03);
 synth.lgn.gain.setTargetAtTime(.1,ac.currentTime,.05);
 synth.f.frequency.setTargetAtTime(400+(1-ny)*1800,ac.currentTime,.08);
}
function leadOff(){if(synth)synth.lgn.gain.setTargetAtTime(0,ac.currentTime,.25)}
async function startAudio(){initAudio();await ac.resume();setupSynth();if(mode==='synth'&&!synthOn&&!startAudio.d){startAudio.d=1;setSynth(true)}}
$('#src').onclick=async()=>{
 initAudio();await ac.resume();
 if(mode==='synth'){
  mode='mic';setSynth(false);
  try{ms=await navigator.mediaDevices.getUserMedia({audio:true});if(src)src.disconnect();src=ac.createMediaStreamSource(ms);src.connect(an);out.gain.value=0;$('#src').textContent='🎙️';toast('Source : micro 🎙️')}
  catch(e){toast('Micro indisponible');mode='file';out.gain.value=1;$('#file').click()}
 }else if(mode==='mic'){
  mode='file';if(ms)ms.getTracks().forEach(t=>t.stop());out.gain.value=1;$('#src').textContent='📁';$('#file').click();
 }else{
  mode='synth';if(el)el.pause();if(src){src.disconnect();src=null}out.gain.value=1;setupSynth();setSynth(true);$('#src').textContent='🎹';toast('Source : synthé 🎹')
 }
};
$('#file').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;initAudio();await ac.resume();
 if(el)el.pause();if(src)src.disconnect();setSynth(false);
 el=new Audio(URL.createObjectURL(f));el.loop=true;src=ac.createMediaElementSource(el);src.connect(an);
 await el.play();$('#play').textContent='Ⅱ';toast('Source : '+f.name.slice(0,16)+' 🎵');
};
$('#play').onclick=async()=>{
 await startAudio();
 if(mode==='synth')setSynth(!synthOn);
 else if(el){if(el.paused){await el.play();$('#play').textContent='Ⅱ'}else{el.pause();$('#play').textContent='▶'}}
};
const avg=(a,s,e)=>{let t=0;for(let i=s;i<e;i++)t+=a[i];return t/(e-s)/255};

/* ================= UI ================= */
document.querySelectorAll('.bb').forEach(b=>b.onclick=()=>{brush=b.dataset.b;document.querySelectorAll('.bb').forEach(x=>x.dataset.a='false');b.dataset.a='true'});
document.querySelectorAll('.pb').forEach(b=>b.onclick=()=>{pal=b.dataset.p;document.querySelectorAll('.pb').forEach(x=>x.classList.toggle('on',x===b));setNebula();toast('Palette : '+pal)});

/* ================= 2D : papier, lavis, encre, crayon ================= */
const gpat=(()=>{const k=document.createElement('canvas');k.width=k.height=256;const x=k.getContext('2d'),d=x.createImageData(256,256);
 for(let i=0;i<d.data.length;i+=4){const v=205+Math.random()*50;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);
 x.strokeStyle='rgba(140,110,70,.08)';for(let i=0;i<110;i++){x.beginPath();const a=Math.random()*256,b=Math.random()*256,an=Math.random()*6.28;x.moveTo(a,b);x.lineTo(a+Math.cos(an)*14,b+Math.sin(an)*14);x.stroke()}
 return ctx.createPattern(k,'repeat')})();
function resize2d(){
 const w=hublot.clientWidth,d=Math.min(devicePixelRatio||1,2);
 cv.width=cv.height=Math.round(w*d);ctx.setTransform(d,0,0,d,0,0);
 if(R){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;fovFix()}
}
const ln=(p,c,w,a)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.globalAlpha=a;ctx.stroke(p)};
const mp=(s,W,H,f)=>s.pts.map((q,i)=>{const o=f?f(q,i):[0,0];return[q.x*W+o[0],q.y*H+o[1]]});
function curve(P){const p=new Path2D;p.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length-1;i++)p.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+P[i+1][0])/2,(P[i][1]+P[i+1][1])/2);const l=P[P.length-1];p.lineTo(l[0],l[1]);return p}
function blob(x,y,r,c,a,sd){ctx.beginPath();for(let k=0;k<=18;k++){const an=k/18*6.283,rr=r*(.85+.2*Math.sin(an*3+sd)+.08*Math.sin(an*7+sd*2)),px=x+Math.cos(an)*rr,py=y+Math.sin(an)*rr;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}
 ctx.fillStyle=c;ctx.globalAlpha=a;ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=1.3;ctx.globalAlpha=Math.min(1,a*2.4);ctx.stroke()}

function drawStroke(s,t,W,H){
 const a=s.pts,n=a.length,sd=s.seed,c1=s.c1,c2=s.c2,ik=s.ink;ctx.lineCap=ctx.lineJoin='round';
 const age=Math.min((performance.now()-s.t0)/14000,1);
 if(n<2){blob(a[0].x*W,a[0].y*H,14+B*10,c1,.3,sd);return}
 if(s.b==='wash'){
  const sp=1+age*.6+M*.3;
  for(let L=0;L<4;L++){const P=mp(s,W,H,(q,i)=>[Math.sin(i*.17+t*.5+L*1.7+sd)*(2+L*2.5)*(1+age),Math.cos(i*.13+t*.4+L*2.3+sd)*(2+L*2.5)*(1+age)]);
   ln(curve(P),L%2?c2:c1,(30+L*9)*sp*(1+B*.2),.06+(L?0:.04))}
  ln(curve(mp(s,W,H)),c1,10*sp,.15);
  for(let i=3;i<n;i+=9){const r=h(i,sd);blob(a[i].x*W+Math.sin(t*.4+i)*3,a[i].y*H,(7+r*14)*(1+age*.8)+B*4,r>.5?c1:c2,.07,sd+i)}
 }else if(s.b==='ink'){
  ctx.strokeStyle=ik;ctx.globalAlpha=.88;
  for(let i=1;i<n;i++){const p=a[i-1],q=a[i],u=i/n;ctx.lineWidth=(1+q.p*3.2)*(.5+Math.sin(u*3.14159)*.7)*(1+B*.4);
   ctx.beginPath();ctx.moveTo(p.x*W+Math.sin(t*3+i)*.3,p.y*H);ctx.lineTo(q.x*W+Math.sin(t*3+i+1)*.3,q.y*H);ctx.stroke()}
  for(let i=5;i<n;i+=11){const r=h(i,sd);if(r<.45)continue;const L=Math.min(age*50*(.4+r),8+r*34),x=a[i].x*W,y=a[i].y*H;
   ctx.lineWidth=1.6;ctx.globalAlpha=.7;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+L);ctx.stroke();ctx.beginPath();ctx.arc(x,y+L,2.2+r*1.5,0,7);ctx.fillStyle=ik;ctx.fill()}
 }else if(s.b==='pencil'){
  const tk=Math.floor(t*8);ctx.setLineDash([7,1.5,3,1.2]);
  for(let L=0;L<3;L++){const P=mp(s,W,H,(q,i)=>[(h(i+tk*17+L*99,sd)-.5)*1.8,(h(i*3+tk*11+L*77,sd)-.5)*1.8]);ln(curve(P),L===1?c2:c1,1+L*.25,.5)}
  ctx.setLineDash([]);ctx.lineWidth=.9;ctx.strokeStyle=c2;ctx.globalAlpha=.32;
  for(let i=0;i<n;i+=3){const q=a[i],l=5+h(i,sd)*9*(1+M),j=h(i+tk*5,sd)*1.4,x=q.x*W,y=q.y*H;ctx.beginPath();ctx.moveTo(x-l*.5+j,y+l*.5);ctx.lineTo(x+l*.5+j,y-l*.5);ctx.stroke()}
 }else if(s.b==='bloom'){
  ln(curve(mp(s,W,H)),ik,1.2,.35);
  for(let i=4;i<n;i+=7){const q=a[i],R0=6+h(i,sd)*12,x=q.x*W,y=q.y*H,op=.65+.35*Math.sin(t*.8+i)+B*.5;
   for(let k=0;k<5;k++){const an=k/5*6.283+i+Math.sin(t*.3+i)*.2,d=R0*op*.9;blob(x+Math.cos(an)*d,y+Math.sin(an)*d,R0*op*.7,k%2?c1:c2,.16,sd+k)}
   ctx.beginPath();ctx.arc(x,y,2.2,0,7);ctx.fillStyle=ik;ctx.globalAlpha=.6;ctx.fill()}
 }else{
  ln(curve(mp(s,W,H)),ik,1.4,.5);const gr=Math.min(1,.25+age*4);
  for(let i=3;i<n;i+=4){const q=a[i],p=a[i-1],side=i%8<4,an=Math.atan2(q.y-p.y,q.x-p.x)+(side?-1:1)*(.9+Math.sin(t*1.2+i*.5+sd)*.25*(1+M*2)),L=(14+h(i,sd)*14)*gr;
   ctx.save();ctx.translate(q.x*W,q.y*H);ctx.rotate(an);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(L*.5,-L*.38,L,0);ctx.quadraticCurveTo(L*.5,L*.38,0,0);
   ctx.fillStyle=side?c1:c2;ctx.globalAlpha=.4;ctx.fill();ctx.strokeStyle=ik;ctx.lineWidth=.9;ctx.globalAlpha=.4;ctx.stroke();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(L*.85,0);ctx.stroke();ctx.restore()}
 }
}
function draw2d(t){
 const W=cv.clientWidth,H=cv.clientHeight,P=PAL[pal];
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 const g=ctx.createRadialGradient(W*.45,H*.4,0,W*.5,H*.5,W*.7);g.addColorStop(0,P.bg);g.addColorStop(1,P.bg2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='multiply';
 for(const s of strokes)drawStroke(s,t,W,H);
 ctx.globalAlpha=.55;ctx.fillStyle=gpat;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
let drawing=false,moved=false,dx0=0,dy0=0;
function ptr(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,nx:(e.clientX-r.left)/r.width,ny:(e.clientY-r.top)/r.height}}
function addP(p,e){
 const l=cur.pts[cur.pts.length-1];
 if(l&&Math.hypot(p.nx-l.x,p.ny-l.y)<.004)return;
 cur.pts.push({x:p.nx,y:p.ny,p:e.pressure>0?e.pressure:.5});lead(p.nx,p.ny);
}
cv.addEventListener('pointerdown',e=>{
 if(im)return;startAudio();drawing=true;moved=false;cv.setPointerCapture(e.pointerId);
 const p=ptr(e),P=PAL[pal],i=Math.floor(Math.random()*3);dx0=p.x;dy0=p.y;
 cur={b:brush,pal,t0:performance.now(),pts:[],seed:Math.random()*100,B,M,c1:P.c[i],c2:P.c[(i+1+Math.floor(Math.random()*2))%3],ink:P.ink};strokes.push(cur);addP(p,e);
});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=ptr(e);if(Math.abs(p.x-dx0)+Math.abs(p.y-dy0)>6)moved=true;addP(p,e)});
addEventListener('pointerup',()=>{if(drawing){drawing=false;leadOff();if(cur){cur.B=B;cur.M=M}cur=null}});
$('#undo').onclick=()=>{strokes.pop();if(im)build();toast('Geste annulé ↩️')};
$('#clear').onclick=()=>{strokes.length=0;if(im)build();toast('Feuille effacée')};
$('#snap').onclick=()=>{
 let url;
 if(im){R.render(scene,cam);url=R.domElement.toDataURL()}
 else url=cv.toDataURL();
 const a=document.createElement('a');a.download='psypaint360-'+Date.now()+'.png';a.href=url;a.click();toast('Capture 📸');
};

/* ================= 3D : papier vivant, ruban aquarelle ================= */
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(72,1,.1,200);
let R=null,hfov=100;function fovFix(){const a=cam.aspect;cam.fov=Math.min(120,Math.max(40,2*Math.atan(Math.tan(hfov*Math.PI/360)/a)*180/Math.PI));cam.updateProjectionMatrix()}
try{R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));$('#three').appendChild(R.domElement)}catch(e){}
